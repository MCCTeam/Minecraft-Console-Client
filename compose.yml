services:
  mcc:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcc:2.0-local
    init: true
    stdin_open: true
    tty: true
    working_dir: /data
    environment:
      MCC_PLUGINS: /data/plugins
      TERM: xterm-256color
    volumes:
      - mcc-data:/data
    command: ["--configurations", "/data/configurations", "--console.General.ConsoleMode=classic"]
    stop_grace_period: 15s

volumes:
  mcc-data:
